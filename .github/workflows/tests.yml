name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-pango-1.0
      - name: Compile Python
        run: /usr/bin/python3 -m compileall -q src tools
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n tools/build_tiny_dfr_fn_fix.sh
